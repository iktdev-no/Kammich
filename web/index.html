<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#000000" />

  <title>Kammich</title>

  <style>
    html,
    body,
    #root {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .kammich-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: #000;

      transition:
        opacity 300ms ease,
        visibility 300ms ease;
    }

    .kammich-splash img {
      display: block;

      width: min(280px, 65vw);
      max-width: 100%;
      max-height: 65vh;

      height: auto;
    }

    .kammich-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="splash" class="kammich-splash">
    <img src="/kammich.svg" alt="Kammich" />
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
