name: Build and Release Jar

env:
  CI: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract version from Git Tag
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

          echo "Extracted version: $VERSION from tag $TAG"

      - name: Set executable permissions for gradlew
        run: chmod +x ./gradlew

      - name: Generate OpenAPI Kotlin client
        run: ./gradlew openApiGenerate

      - name: Generate TypeScript types
        run: ./gradlew generateTs

      - name: Build React frontend
        env:
          CI: false
        run: |
          cd web
          npm ci
          npm run build

      - name: Copy React build into Spring Boot resources
        run: |
          rm -rf src/main/resources/static
          mkdir -p src/main/resources/static
          cp -r web/dist/* src/main/resources/static/

      - name: Build Spring Boot executable jar
        run: ./gradlew bootJar
        env:
          VERSION: ${{ github.ref_name }}

      - name: Rename Jar file
        run: |
          cd build/libs

          JAR_FILE=$(ls *-boot.jar 2>/dev/null || ls *.jar | head -n 1)
          FINAL_NAME="Kammich-v${VERSION}.jar"

          mv "$JAR_FILE" "$FINAL_NAME"

          echo "JAR_FILE=$FINAL_NAME" >> $GITHUB_ENV

          echo "Renamed $JAR_FILE to $FINAL_NAME"

      - name: Generate SHA-256 checksum
        run: |
          cd build/libs

          sha256sum "${JAR_FILE}" > "${JAR_FILE}.sha256"

          echo "Generated checksum:"
          cat "${JAR_FILE}.sha256"

      - name: Create GitHub Release & Upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release Kammich ${{ env.TAG }}
          files: |
            build/libs/Kammich-v*.jar
            build/libs/Kammich-v*.jar.sha256
          generate_release_notes: true